spring:
  application:
    name: triagem-service

services:
  paciente:
    base-url: http://paciente-service:8082

server:
  port: 8083

logging:
  level:
    root: info
    feign: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    com.healthsys.triagemservice.client: DEBUG

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

