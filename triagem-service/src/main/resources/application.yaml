spring:
  application:
    name: triagem-service

services:
  paciente:
    base-url: http://paciente-service:8082

server:
  port: 8083

logging:
  level:
    root: info

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}

