spring:
  application:
    name: triagem-service

# O acesso ao paciente-service é feito via Eureka usando @FeignClient(name = "paciente-service")

server:
  port: 8083

logging:
  level:
    root: info
    feign: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    com.healthsys.triagemservice.client: DEBUG

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

