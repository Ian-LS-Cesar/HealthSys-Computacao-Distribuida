spring:
  application:
    name: triagem-service
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
  cache:
    type: redis
    redis:
      time-to-live: ${REDIS_TIME_TO_LIVE:600000}
      cache-null-values: false

# O acesso ao paciente-service é feito via Eureka usando @FeignClient(name = "paciente-service")

server:
  port: 8083

logging:
  level:
    root: info
    feign: DEBUG
    org.springframework.cloud.openfeign: DEBUG
    com.healthsys.triagemservice.client: DEBUG

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

