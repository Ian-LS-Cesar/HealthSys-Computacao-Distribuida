services:
  paciente-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: paciente-service
    ports:
      - "${PACIENTE_SERVICE_PORT}:8082"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://paciente-service-db:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: ${SPRING_JPA_HIBERNATE_DDL_AUTO}
      SPRING_JPA_SHOW_SQL: ${SPRING_JPA_SHOW_SQL}
    depends_on:
      - paciente-service-db
    networks:
      - internal
    restart: unless-stopped

  paciente-service-db:
    image: postgres:latest
    container_name: paciente-service-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${PACIENTE_SERVICE_DB_PORT}:5432"
    volumes:
      - paciente-service-db-data:/var/lib/postgresql
    networks:
      - internal
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  paciente-service-db-data: