services:
  service-discovery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: service-discovery
    ports:
      - "${SERVICE_DISCOVERY_PORT}:8761"
    networks:
      - internal
    restart: unless-stopped
    env_file: ../.env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
