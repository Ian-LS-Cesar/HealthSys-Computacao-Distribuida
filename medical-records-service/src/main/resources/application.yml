server:
  port: 8085

spring:
  application:
    name: medical-records-service

  # FORMATO CORRETO DO SPRING BOOT MODERNO
  # Ele usa apenas a URI e o prefixo 'spring.data.'
  # Formato simplificado e correto do Spring Boot 4
  mongodb:
    uri: ${SPRING_MONGODB_URI:mongodb://localhost:5005/db}

  # RabbitMQ
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME}
    password: ${SPRING_RABBITMQ_PASSWORD}

# Eureka
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ${spring.application.name}