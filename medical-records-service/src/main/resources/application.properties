spring.application.name=medical-records-service
server.port=8085

# FORMATO CORRETO DO SPRING BOOT MODERNO
# Ele usa apenas a URI e o prefixo 'spring.data.'
# Formato simplificado e correto do Spring Boot 4
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:5005/medical_db}

# RabbitMQ
spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${SPRING_RABBITMQ_USERNAME:admin}
spring.rabbitmq.password=${SPRING_RABBITMQ_PASSWORD:password}

# Eureka
eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}