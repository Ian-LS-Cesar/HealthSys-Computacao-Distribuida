services:
  medical-records-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: medical-records-service
    ports:
      - "${MEDICAL_RECORDS_SERVICE_PORT}:8085"
    environment:
      SPRING_MONGODB_HOST: medical-records-service-db
      SPRING_MONGODB_PORT: "27017"
      SPRING_MONGODB_DATABASE: medical_db
      SPRING_MONGODB_USERNAME: ${MONGO_USER}
      SPRING_MONGODB_PASSWORD: ${MONGO_PASSWORD}
      SPRING_MONGODB_AUTHENTICATION_DATABASE: admin
      SPRING_RABBITMQ_HOST: notification-service-db
      SPRING_RABBITMQ_PORT: ${RABBITMQ_AMQP_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
    depends_on:
      medical-records-service-db:
        condition: service_healthy        # ← espera o MongoDB estar pronto
      service-discovery:
        condition: service_healthy        # ← espera o Eureka estar pronto
    networks:
      - internal
    restart: unless-stopped
    env_file:
      - ../.env

  medical-records-service-db:
    image: mongo:latest
    container_name: medical-records-service-db
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "${MEDICAL_RECORDS_SERVICE_DB_PORT}:27017"
    volumes:
      - medical-records-service-db-data:/data/db
    networks:
      - internal
    restart: unless-stopped
    env_file:
      - ../.env
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  internal:
    external: true
    name: ${DOCKER_NETWORK}

volumes:
  medical-records-service-db-data: