server:
  port: 8080

spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: http://auth-service:8081
              predicates:
                - Path=/auth/**
              filters:
                - StripPrefix=1

            - id: paciente-service
              uri: http://paciente-service:8082
              predicates:
                - Path=/api/**
              filters:
                - StripPrefix=1
                - JwtValidation