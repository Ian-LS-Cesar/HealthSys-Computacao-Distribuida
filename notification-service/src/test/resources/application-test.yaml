# Disable Eureka client for testing
eureka:
  client:
    enabled: false

# RabbitMQ Test Configuration
spring:
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        auto-startup: false
      direct:
        auto-startup: false

management:
  health:
    rabbit:
      enabled: false
  # Management endpoints
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always