services:
  bed-db:
    image: postgres:18.4-alpine
    container_name: bed-db
    env_file:
      - ../.env
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${BED_DB_NAME}
    ports:
      - "${BED_SERVICE_DB_PORT}:5432"
    networks:
      - internal
    volumes:
      - bed_db_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${BED_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  bed-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bed-service
    env_file:
      - ../.env
    ports:
      - "${BED_SERVICE_PORT}:8086"
    environment:
      SERVER_PORT: 8086
      SPRING_DATASOURCE_URL: jdbc:postgresql://bed-db:5432/${BED_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_RABBITMQ_HOST: notification-service-db         
      SPRING_RABBITMQ_PORT: ${RABBITMQ_AMQP_PORT}
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE}
      EUREKA_INSTANCE_HOSTNAME: bed-service
      EUREKA_INSTANCE_NON_SECURE_PORT: 8086
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "false"
      REDIS_PORT: ${REDIS_PORT}
    depends_on:
      bed-db:
        condition: service_healthy            
      service-discovery:
        condition: service_healthy            
    networks:
      - internal
    restart: unless-stopped

networks:
  internal:
    external: true
    name: ${DOCKER_NETWORK}

volumes:
  bed_db_data: