services:
  redis:
    image: redis:8.8.0-alpine
    container_name: redis
    restart: always
    command: [
      "redis-server",
      "--protected-mode", "yes",
      "--user", "default", "off",
      "--user", "${REDIS_USER}", "on", ">${REDIS_PASSWORD}", "~*", "+@all"
    ]
    env_file:
      - ../../.env
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - ./.redis_data:/data
    networks:
      - internal

networks:
    internal:
        external: true
        name: ${DOCKER_NETWORK}